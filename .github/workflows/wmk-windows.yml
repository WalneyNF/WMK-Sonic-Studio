name: WMK Sonic Studio - Windows para download
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wmk-windows.yml'
      - 'src/**'
      - 'resources/**'
      - 'CMakeLists.txt'
permissions:
  contents: write
concurrency:
  group: wmk-windows-${{ github.ref }}
  cancel-in-progress: false
env:
  ZIG_VERSION: '0.14.1'
  ZIG_SHA256: 24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c
  JUCE_VERSION: '8.0.4'
  JUCE_SHA256: 0effe9823a6fd8a4f98e5c08be7d308350e417b2d15dcf34011e778fefbbf005
jobs:
  build:
    name: Compilar Windows x64 (Zig)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ferramentas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/opt && cd ~/opt
          curl -fsSL --retry 3 -o zig.tar.xz "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          echo "$ZIG_SHA256  zig.tar.xz" | sha256sum -c -
          tar xf zig.tar.xz
          curl -fsSL --retry 3 -o juce.tar.gz "https://github.com/juce-framework/JUCE/archive/refs/tags/$JUCE_VERSION.tar.gz"
          echo "$JUCE_SHA256  juce.tar.gz" | sha256sum -c -
          tar xzf juce.tar.gz && mv "JUCE-$JUCE_VERSION" "juce-$JUCE_VERSION"
      - name: Compilar motor e aplicativo
        shell: bash
        run: |
          set -euo pipefail
          ZIG="$HOME/opt/zig-x86_64-linux-$ZIG_VERSION/zig" JUCE_DIR="$HOME/opt/juce-$JUCE_VERSION" OUT=build-win ./scripts/build-windows-zig.sh
          test -s build-win/LYNX.exe
          ./scripts/fetch-onnxruntime.sh windows build-win
      - uses: actions/upload-artifact@v4
        with:
          name: binario-wmk-windows
          path: |
            build-win/LYNX.exe
            build-win/LYNX-bridge32.exe
            build-win/onnxruntime.dll
            build-win/lynx-asio.dll
            build-win/lynx-asio32.dll
          if-no-files-found: error
  package:
    name: Testar e criar EXE + ZIP
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binario-wmk-windows
          path: bin
      - name: Verificar aplicativo em execução
        shell: pwsh
        run: |
          $p = Start-Process 'bin\LYNX.exe' -ArgumentList '--selftest', "$PWD\selftest.txt", "$PWD\demo.lynx" -Wait -PassThru
          if ($p.ExitCode -ne 0 -or -not (Test-Path selftest.txt) -or -not (Select-String -Path selftest.txt -Pattern '^result=OK' -Quiet)) { throw 'Falhou selftest do aplicativo' }
      - name: Gerar ZIP portátil e instalador NSIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "WMK-Sonic-Studio-Windows-x64"
          New-Item -ItemType Directory -Force "pkg\$name",dist | Out-Null
          Copy-Item bin\LYNX.exe,LICENSE,THIRD_PARTY.md,PRIVACY.md "pkg\$name\"
          foreach ($file in @('onnxruntime.dll','LYNX-bridge32.exe','lynx-asio.dll','lynx-asio32.dll')) { if (Test-Path "bin\$file") { Copy-Item "bin\$file" "pkg\$name\" } }
          foreach ($doc in @('manual.html','manuais.html','roadmap.html','pesquisa.html')) { if (Test-Path $doc) { Copy-Item $doc "pkg\$name\" } }
          if (Test-Path 'README.md') { Copy-Item README.md "pkg\$name\" }
          if (Test-Path 'asio\Register LYNX ASIO.bat') { Copy-Item 'asio\Register LYNX ASIO.bat','asio\Unregister LYNX ASIO.bat' "pkg\$name\" }
          Compress-Archive -Path "pkg\$name" -DestinationPath "dist\WMK-Sonic-Studio-Portable-Windows-x64.zip"
          $nsis = (Get-Command makensis -ErrorAction SilentlyContinue).Source
          if (-not $nsis) { $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe" }
          & $nsis -V2 -INPUTCHARSET UTF8 "-DVERSION=0.1.28" "-DSTAGE=$PWD\pkg\$name" "-DOUTFILE=$PWD\dist\WMK-Sonic-Studio-Setup-Windows-x64.exe" "-DICON=$PWD\resources\LYNX.ico" resources\installer\LYNX.nsi
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao gerar instalador NSIS' }
          Get-ChildItem dist
      - name: Gerar SHA256
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" } | Set-Content dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: WMK-Sonic-Studio-downloads
          path: dist/*
          if-no-files-found: error
      - name: Publicar prerelease para downloads públicos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="wmk-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/* --prerelease --target "$GITHUB_SHA" --title "WMK Sonic Studio - Windows (alfa ${GITHUB_RUN_NUMBER})" --notes "Versão experimental criada automaticamente pelo GitHub Actions. Binário técnico interno: LYNX.exe. Teste em ambiente seguro antes de usar em produção. Código-fonte e avisos de terceiros: https://github.com/$GITHUB_REPOSITORY"
